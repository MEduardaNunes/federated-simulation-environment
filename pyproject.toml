[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-envirenment"
version = "1.0.0"
description = "Federated Learning with PyTorch, Flower and Gymnasium"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.28.0",
    "flwr-datasets[vision]>=0.6.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "gymnasium",
    "wandb"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "meduardanunes"
fab-format-version = 1
flwr-version-target = "1.31.0"

[tool.flwr.app.components]
serverapp = "structure.server_app:app"
clientapp = "structure.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
fraction-evaluate = 0.0
fraction-train = 0.1
local-epochs = 1
learning-rate = 0.05
batch-size = 64
save-model = false
alpha-dirichlet = 0.1
K = 10
dataset = "CIFAR-10_NO_IID"
strategy = "POC"
proximal-mu = 0.1
d = 0.3